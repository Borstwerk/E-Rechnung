name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  # Schneller Durchlauf auf Linux: baut die gesamte Solution einschließlich
  # der WPF-Anwendung (EnableWindowsTargeting) und führt alle plattform-
  # neutralen Tests aus. Fängt den Großteil der Fehler ab.
  build-and-test:
    name: Build und Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Java einrichten (für die externe Gegenprüfung)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Wiederherstellen
        run: dotnet restore EInvoiceSender.sln

      - name: Formatprüfung
        run: dotnet format EInvoiceSender.sln --verify-no-changes --no-restore

      - name: Bauen
        run: dotnet build EInvoiceSender.sln -c Release --no-restore

      # Zuerst beschaffen: die Ende-zu-Ende-Tests bestehen darauf, dass die
      # externen Validatoren tatsächlich laufen (REQUIRE_EXTERNAL_VALIDATORS).
      - name: Externe Validatoren beschaffen
        run: ./build/fetch-validators.sh

      - name: Tests
        env:
          REQUIRE_EXTERNAL_VALIDATORS: "1"
        run: dotnet test EInvoiceSender.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Gegenprüfung der Golden Master mit CEN-Schematron und veraPDF
        run: ./build/validate-golden-masters.sh

      - name: Testergebnisse veröffentlichen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Veröffentlichung und Installer erfordern zwingend Windows:
  # PublishReadyToRun unterstützt kein Cross-OS, und MSI/EXE lassen sich nur
  # unter Windows erzeugen.
  publish-windows:
    name: Veröffentlichung (Windows)
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Java einrichten (für die Gegenprüfung)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Externe Validatoren beschaffen
        shell: bash
        run: ./build/fetch-validators.sh

      # Verpflichtend: Ein UI-Meilenstein gilt erst als verifiziert, wenn ein
      # Windows-Agent Build und Tests erfolgreich ausgeführt hat.
      - name: Tests unter Windows
        env:
          REQUIRE_EXTERNAL_VALIDATORS: "1"
        run: dotnet test EInvoiceSender.sln -c Release

      - name: Self-contained win-x64 veröffentlichen
        run: >
          dotnet publish src/EInvoiceSender.App
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true
          -o artifacts/publish/win-x64

      # Der Installer wird nur hier gebaut: WiX erzeugt MSI-Dateien
      # ausschließlich unter Windows.
      - name: Installer bauen
        run: >
          dotnet build installer/EInvoiceSender.Setup
          -c Release
          -p:PublishDir=${{ github.workspace }}\artifacts\publish\win-x64\

      - name: Installer-Metadaten prüfen
        shell: pwsh
        run: >
          ./build/Test-InstallerMetadata.ps1
          -MsiPath installer/EInvoiceSender.Setup/bin/Release/BorstWerk-E-Rechnung-Setup.msi
          -ApplicationPath artifacts/publish/win-x64/EInvoiceSender.exe

      - name: Installer bereitstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Get-ChildItem -Recurse -Filter *.msi installer |
            ForEach-Object { Copy-Item $_.FullName artifacts/release/ }

      - name: Drittanbieterhinweise beilegen
        shell: pwsh
        run: |
          Copy-Item installer/Drittanbieterhinweise/README.md `
            artifacts/publish/win-x64/Drittanbieterhinweise.md -Force

      - name: Portable ZIP erzeugen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Compress-Archive -Path artifacts/publish/win-x64/* `
            -DestinationPath artifacts/release/BorstWerk-E-Rechnung-portable-win-x64.zip -Force

      # Die Namen stehen nirgends hier: Es wird über den Ordner gelaufen, also
      # tragen die Prüfsummen von selbst die tatsächlichen Dateinamen.
      #
      # Die Liste wird vorher vollständig eingesammelt und SHA256SUMS.txt
      # ausgenommen. Sonst kann die Aufzählung die Datei erwischen, die
      # währenddessen im selben Ordner entsteht – und in den Prüfsummen stünde
      # eine Zeile über die Prüfsummendatei, die niemand nachrechnen kann.
      - name: Prüfsummen erzeugen
        shell: pwsh
        run: |
          $dateien = @(Get-ChildItem artifacts/release -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' })
          $dateien | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path artifacts/release/SHA256SUMS.txt -Encoding utf8
          Get-Content artifacts/release/SHA256SUMS.txt

      - name: Artefakte bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: borstwerk-e-rechnung-win-x64
          path: artifacts/release/
