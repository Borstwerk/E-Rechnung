name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_artifacts:
        description: >-
          MSI, tragbare ZIP-Fassung und Prüfsummen dauerhaft als
          GitHub-Artefakt ablegen. Nur für Auslieferungsläufe nötig.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  # Schneller Durchlauf auf Linux: baut die gesamte Solution einschließlich
  # der WPF-Anwendung (EnableWindowsTargeting) und führt alle plattform-
  # neutralen Tests aus. Fängt den Großteil der Fehler ab.
  build-and-test:
    name: Build und Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Java einrichten (für die externe Gegenprüfung)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Wiederherstellen
        run: dotnet restore EInvoiceSender.sln

      - name: Formatprüfung
        run: dotnet format EInvoiceSender.sln --verify-no-changes --no-restore

      - name: Bauen
        run: dotnet build EInvoiceSender.sln -c Release --no-restore

      # Zuerst beschaffen: die Ende-zu-Ende-Tests bestehen darauf, dass die
      # externen Validatoren tatsächlich laufen (REQUIRE_EXTERNAL_VALIDATORS).
      - name: Externe Validatoren beschaffen
        run: ./build/fetch-validators.sh

      - name: Tests
        env:
          REQUIRE_EXTERNAL_VALIDATORS: "1"
        run: dotnet test EInvoiceSender.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Gegenprüfung der Golden Master mit CEN-Schematron und veraPDF
        run: ./build/validate-golden-masters.sh

      # Bei einem roten Lauf sind die .trx-Dateien für die Fehlersuche nützlich.
      # Grüne Läufe müssen sie nicht dauerhaft im GitHub-Artefaktspeicher ablegen.
      # Zusätzlich kann der Upload zentral über die Repository-Variable
      # ARTEFAKT_UPLOAD abgeschaltet bleiben, solange Speicher knapp ist.
      - name: Testergebnisse bei rotem Lauf sichern
        if: failure() && vars.ARTEFAKT_UPLOAD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Veröffentlichung und Installer erfordern zwingend Windows:
  # PublishReadyToRun unterstützt kein Cross-OS, und MSI/EXE lassen sich nur
  # unter Windows erzeugen.
  publish-windows:
    name: Veröffentlichung (Windows)
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Java einrichten (für die Gegenprüfung)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Externe Validatoren beschaffen
        shell: bash
        run: ./build/fetch-validators.sh

      # Verpflichtend: Ein UI-Meilenstein gilt erst als verifiziert, wenn ein
      # Windows-Agent Build und Tests erfolgreich ausgeführt hat.
      - name: Tests unter Windows
        env:
          REQUIRE_EXTERNAL_VALIDATORS: "1"
        run: dotnet test EInvoiceSender.sln -c Release

      - name: Release-Paketierungslogik prüfen
        shell: pwsh
        run: ./build/Test-ReleasePackaging.ps1

      # Publish, MSI-Bau und -Prüfung, portable Fassung und Prüfsummen laufen
      # über denselben maßgeblichen Weg wie bei einem lokalen Releasebau.
      - name: Releasepaket bauen
        shell: pwsh
        run: ./build/Build-Release.ps1

      # Das Releasepaket wird weiterhin bei jedem CI-Lauf gebaut und geprüft.
      # Dauerhaft auf GitHub gespeichert wird es aber nur bei einem bewusst
      # manuell gestarteten Auslieferungslauf.
      - name: Artefakte für die Auslieferung bereitstellen
        if: inputs.publish_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: borstwerk-e-rechnung-win-x64
          path: artifacts/release/
